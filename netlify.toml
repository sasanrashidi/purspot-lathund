[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/customers/*"
  to = "/.netlify/functions/customers/:splat"
  status = 200

[[redirects]]
  from = "/api/customers"
  to = "/.netlify/functions/customers"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
